name: Test and Deploy to Rahti

on:
  push:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Run Maven tests
        run: |
          chmod +x ./mvnw
          ./mvnw test

      - name: Trigger Rahti Build & Deploy
        run: curl -X POST -f "${{ secrets.RAHTI_WEBHOOK_URL }}"